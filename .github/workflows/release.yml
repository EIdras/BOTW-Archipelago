# The release of a version, built on GitHub's Windows machines.
#
# Pushing a tag vX.Y.Z (the world_version of botw_world/archipelago.json) tests
# the project on Linux and Windows (tests.yml), builds botw.apworld
# (tools/build_release.py), the one file for both systems, and makes a draft
# release with it, to check and publish by hand.
# Run by hand (Actions > Release > Run workflow), it tests and builds only:
# the apworld is attached to the run, as an artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install --upgrade pip
          venv\Scripts\python -m pip install -r requirements-player.txt

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: venv\Scripts\python -c "import sys; sys.path.insert(0, '.'); from tools.build_release import check_tag; check_tag('${{ github.ref_name }}')"

      - name: Build
        run: venv\Scripts\python tools\build_release.py

      - name: Keep the files of a run by hand
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/botw.apworld

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" dist\botw.apworld `
            --draft --generate-notes --title "BOTW AP $version"
