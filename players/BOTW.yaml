# Player options for Breath of the Wild. Generation (tools/generate_native.py)
# reads every YAML file of this folder: one file per player of the multiworld.
name: Player
game: Breath of the Wild
description: Breath of the Wild, Wii U v208 (EUR, USA or JPN) in Cemu.
Breath of the Wild:
  progression_balancing: 50
  accessibility: full
  # What finishes your game: ganon, divine_beasts (the four) or shrines (goal_shrines of them)
  goal: ganon
  goal_shrines: 60
  # Hyrule Castle's sanctum, where Ganon waits, stays sealed until all of this is met
  # (0 or false: not asked); the AP journal says what is missing. Presets of the options page:
  #   Easy:   4 Divine Beasts, Master Sword, runes
  #   Medium: 2 Divine Beasts, Master Sword, runes (the values below)
  #   Hard:   nothing, Ganon whenever you like
  sanctum_divine_beasts: 2
  sanctum_shrines: 0
  sanctum_master_sword: true
  sanctum_runes: true
  # 0 to 2 Archipelago items at each of Beedle's 16 shops
  beedle_shop_items: 2
  # 0 to 28 Archipelago items on the 14 village stalls, at random (2 at most on one stall)
  stall_items: 10
  # When you die, everyone with DeathLink dies; when they die, so do you
  # (Mipha's Grace and fairies still save Link)
  death_link: true
  # How the weapons of the filler are spread over the game: smoothed (the weaker first, the amiibo's
  # treasures last), loosely_smoothed (the same, a weapon may come a level earlier or later) or anywhere
  weapon_order: smoothed
  # The regions' maps: region_keys (items, and a region's locations are in the logic once its map is received),
  # items (items only) or vanilla (each tower reveals its map, as in the game)
  tower_maps: region_keys
  # A map placed at one of the Great Plateau's first locations (its terminals or its tower):
  # gentle (Dueling Peaks, Hateno, Lake or Faron), any, or none
  early_map: gentle
  # With tower_maps on region_keys: a tower is in the logic once its region's map is received, like the rest of
  # its region (region_lock always asks for it)
  towers_need_maps: false
  # With tower_maps on region_keys: a region enters the logic once its map is received and it borders a region
  # already in the logic (with map_travel_points, bordering one or not); the game keeps Link out of the others
  region_lock: false
  # With the maps as items: a map received also opens the travel point of a shrine near where its region begins,
  # once Link has the Paraglider
  map_travel_points: false
  # Epona and the Master Cycle Zero become four Progressive Horses, given in order: the Giant Horse, the Royal White
  # Stallion, Epona, then the Master Cycle Zero
  progressive_horse: false
  # The Master Cycle Zero (Champions' Ballad DLC) in the Gerudo Desert and on Death Mountain, and through the
  # invisible walls that stop horses; indoors still refuse it
  bike_anywhere: false
  # containers or vanilla_statues: how hearts and stamina are won. containers: 17 heart containers, 5 stamina vessels
  # and 20 Spirit Orbs are items. vanilla_statues: 108 Spirit Orbs and no container, the Goddess Statues give them all
  # (four orbs each), and the Master Sword asks for 40 orbs. That adds 66 items, which need room: chest_sanity, or
  # korok_sanity with a lower korok_local_filler. statue_checks: each trade at a statue is a location (Goddess Statue -
  # Offering k, 4k orbs) and gives nothing more; four orbs per offering are items, and the containers too
  spirit_orbs: containers
  # 1 to 30: with statue_checks, how many trades are locations
  statue_offerings: 5
  # off, check_only or ap_items: whether the chests of Hyrule's surface (1,180), of its shrines (174) and of the
  # Divine Beasts (35, sent once a beast is freed if left inside) are locations. check_only: opening a chest sends
  # its item and the chest keeps its own contents. ap_items: each chest of the surface and of the Divine Beasts holds
  # the item it sends, under its name (a shrine's keeps its own, see shrine_chest_items). Unless chest_progression, the chests hold nothing
  # needed to finish a game. Traps stay as many as without the chests
  chest_sanity: off
  # With chest_sanity, chests may hold items needed to finish a game: the logic asks what the map says opening each one
  # takes (runes, bombs, Death Mountain's heat, a Divine Beast freed, the Gerudo Set in Gerudo Town; every rune inside
  # a shrine or a Divine Beast). Frozen chests, those under a boulder, after a Lynel or from a side quest still hold
  # nothing needed; a buried chest holds nothing needed in the first half of the game
  chest_progression: false
  # With chest_sanity on ap_items, whether a shrine's chest holds the item it sends too. WARNING: about 1 GB more
  # disk space, as a shrine's chest only changes with its whole shrine. The shrines are built once (a few seconds)
  # from your own base game, which must be installed as a folder (not a .wua or .wud file), then shared by every
  # seed. Without such a folder, the shrines' chests keep their contents
  shrine_chest_items: false
  # With chest_sanity, whether the 118 chests of Master Mode (The Master Trials, DLC 1), each on the platform of an
  # Octorok balloon, are locations too. The seed is then played in a Master Mode save: the client stops on a Normal
  # mode one. Without it, a seed plays in either mode, and these chests keep their contents in Master Mode
  master_mode: false
  # Whether the Koroks are locations: finding one sends its item, and the Korok still gives its seed (Hestu is
  # unchanged). Unless korok_progression, the Koroks hold nothing needed to finish a game. Traps stay as many as
  # without them
  korok_sanity: false
  # With korok_sanity, how many of the 900 Koroks are locations, drawn by the seed (900: every one). Each adds an
  # item to the multiworld, mostly filler
  korok_count: 100
  # With korok_sanity, the share in percent of those Koroks that hold filler of your own world: they send nothing to
  # the other players (0 to 100). The others hold any item no progression needs (any item with korok_progression),
  # from any world
  korok_local_filler: 95
  # With korok_sanity, Koroks may hold items needed to finish a game: the logic asks what each puzzle takes (bombs,
  # Magnesis, Death Mountain's heat, the Gerudo Set in Gerudo Town). Those behind an ice wall or ivy to burn still
  # hold nothing needed
  korok_progression: false
  # Whether the 73 side quests are locations: finishing one sends its item, and the quest still gives its reward
  # (but Thunder Magnet's Rubber Helm and Lynel Safari's Zora Greaves: their sets are items). Left out: Slated for
  # Upgrades, A Gift from the Monks, The Statue's Bargain and the EX quests. Unless quest_progression, they hold nothing
  # needed to finish a game. My Hero asks for the Master Sword, which then becomes a progression item
  side_quest_sanity: false
  # Whether the 42 shrine quests are locations: finishing one, which raises its shrine, sends its item. Each asks
  # what its shrine asks. Unless quest_progression, they hold nothing needed to finish a game
  shrine_quest_sanity: false
  # With side_quest_sanity or shrine_quest_sanity, quests may hold items needed to finish a game: the logic asks what
  # each takes (a shrine quest its shrine's; a side quest a rune, an armor set, a Divine Beast freed, the Camera, the
  # maps of the regions it goes through). Hylian Homeowner, A Gift for the Great Fairy, The Weapon Connoisseur, From
  # the Ground Up and the two Tarrey Town quests after it, Hunt for the Giant Horse and The Royal White Stallion (two
  # stamina wheels to tame the horse) still hold nothing needed
  quest_progression: false
  # Whether the 86 field bosses whose defeat the game saves (Hinoxes, Stalnoxes, Stone Taluses, Moldugas) are
  # locations: the first defeat of each sends its item; a Blood Moon brings the boss back, its location stays sent.
  # Unless boss_progression, they hold nothing needed to finish a game
  boss_sanity: false
  # With boss_sanity, bosses may hold items needed to finish a game: the logic asks for the boss's region and, on
  # Death Mountain's burning slopes, the heat's protection; never a weapon
  boss_progression: false
  # Share of the filler that becomes bonus items, 0 to 100: armor (circlets, earrings, monster masks, the amiibo
  # and DLC sets...), saddles and bridles; 38 at most, none needed to finish a game. Traps keep their count
  bonus_items: 0
  # More kinds of filler: what upgrades armor at the Great Fairies (dragon parts, Lynel parts, Guardian parts,
  # Luminous Stones), hearty and mighty food, raw or cooked, and 20 Bomb Arrows
  extra_filler: false
  # Share of the filler (arrows, elixirs, weapons, gems, rupees) that becomes traps, 0 to 100, and how likely each is
  # compared with the others (a trap left out never comes up): Weapon Shatter, Blood Moon,
  # Rupoor, Hearts Down, Strip Down, Cucco Swarm, Yiga Ambush, Paranoia, Downpour, Freeze, Lightning Strike, Fire.
  # The cuccos, the Yiga, the storm's lightning and the elements can kill Link.
  trap_percentage: 0
  trap_weights:
    Weapon Shatter: 1
    Blood Moon: 1
    Rupoor: 1
    Hearts Down: 1
    Strip Down: 1
    Cucco Swarm: 1
    Yiga Ambush: 1
    Paranoia: 1
    Downpour: 1
    Freeze: 0
    Lightning Strike: 0
    Fire: 0
  start_inventory_from_pool: {}
