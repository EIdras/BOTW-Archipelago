# Player options for Breath of the Wild. Generation (tools/generate_native.py)
# reads every YAML file of this folder: one file per player of the multiworld.
name: Player
game: Breath of the Wild
description: Breath of the Wild, Wii U v208 (EUR, USA or JPN) in Cemu.
Breath of the Wild:
  progression_balancing: 50
  accessibility: full
  # What finishes your game: ganon, divine_beasts (the four) or shrines (goal_shrines of them)
  goal: ganon
  goal_shrines: 60
  # Hyrule Castle's sanctum, where Ganon waits, stays sealed until all of this is met
  # (0 or false: not asked); the AP journal says what is missing. Presets of the options page:
  #   Easy:   4 Divine Beasts, Master Sword, runes
  #   Medium: 2 Divine Beasts, Master Sword, runes (the values below)
  #   Hard:   nothing, Ganon whenever you like
  sanctum_divine_beasts: 2
  sanctum_shrines: 0
  sanctum_master_sword: true
  sanctum_runes: true
  # 0 to 2 Archipelago items at each of Beedle's 16 shops
  beedle_shop_items: 2
  # 0 to 28 Archipelago items on the 14 village stalls, at random (2 at most on one stall)
  stall_items: 10
  # When you die, everyone with DeathLink dies; when they die, so do you
  # (Mipha's Grace and fairies still save Link)
  death_link: true
  # How the weapons of the filler are spread over the game: smoothed (the weaker first, the amiibo's
  # treasures last), loosely_smoothed (the same, a weapon may come a level earlier or later) or anywhere
  weapon_order: smoothed
  # The regions' maps: region_keys (items, and a region's locations are in the logic once its map is received),
  # items (items only) or vanilla (each tower reveals its map, as in the game)
  tower_maps: region_keys
  # A map placed at one of the Great Plateau's first locations (its terminals or its tower):
  # gentle (Dueling Peaks, Hateno, Lake or Faron), any, or none
  early_map: gentle
  # Share of the filler (arrows, elixirs, weapons, gems, rupees) that becomes traps, 0 to 100, and how likely each is
  # compared with the others (a trap left out never comes up): Weapon Shatter, Blood Moon,
  # Rupoor, Hearts Down, Strip Down, Cucco Swarm, Yiga Ambush, Paranoia, Downpour. The cuccos, the Yiga
  # and the storm's lightning can kill Link.
  trap_percentage: 0
  trap_weights:
    Weapon Shatter: 1
    Blood Moon: 1
    Rupoor: 1
    Hearts Down: 1
    Strip Down: 1
    Cucco Swarm: 1
    Yiga Ambush: 1
    Paranoia: 1
    Downpour: 1
  start_inventory_from_pool: {}
