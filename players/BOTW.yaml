# Player options for Breath of the Wild. Generation (tools/generate_native.py)
# reads every YAML file of this folder: one file per player of the multiworld.
name: Player
game: Breath of the Wild
description: Breath of the Wild, Wii U EUR v208 in Cemu.
Breath of the Wild:
  progression_balancing: 50
  accessibility: full
  # Hyrule Castle's sanctum stays sealed until what follows is met (the AP journal says
  # what is missing). The presets of the options page set them:
  #   Easy:   goal_type divine_beasts, divine_beasts_required 4, Master Sword, runes
  #   Medium: goal_type divine_beasts, divine_beasts_required 2, Master Sword, runes
  #   Hard:   goal_type ganon, neither Master Sword nor runes
  # ganon, divine_beasts or shrines
  goal_type: ganon
  shrines_required: 40
  divine_beasts_required: 4
  # The Master Sword received, then the four runes received
  ganon_master_sword: false
  ganon_runes: true
  # 0 to 2 Archipelago items at each of Beedle's 16 shops
  beedle_shop_items: 2
  # 0 to 28 Archipelago items on the 14 village stalls, at random (2 at most on one stall)
  stall_items: 10
  # When you die, everyone with DeathLink dies; when they die, so do you
  # (Mipha's Grace and fairies still save Link)
  death_link: true
  # Share of the filler (the rupees) that becomes traps, 0 to 100, and how likely each is
  # compared with the others (a trap left out never comes up): Weapon Shatter, Blood Moon,
  # Rupoor, Hearts Down, Strip Down, Cucco Swarm. Only the cuccos can kill Link.
  trap_percentage: 0
  trap_weights:
    Weapon Shatter: 1
    Blood Moon: 1
    Rupoor: 1
    Hearts Down: 1
    Strip Down: 1
    Cucco Swarm: 1
  start_inventory_from_pool: {}
