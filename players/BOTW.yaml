# Player options for Breath of the Wild. Generation (tools/generate_native.py)
# reads every YAML file of this folder: one file per player of the multiworld.
name: Player
game: Breath of the Wild
description: Breath of the Wild, Wii U v208 (EUR, USA or JPN) in Cemu.
Breath of the Wild:
  progression_balancing: 50
  accessibility: full
  # What finishes your game: ganon, divine_beasts (the four) or shrines (goal_shrines of them)
  goal: ganon
  goal_shrines: 60
  # Hyrule Castle's sanctum, where Ganon waits, stays sealed until all of this is met
  # (0 or false: not asked); the AP journal says what is missing. Presets of the options page:
  #   Easy:   4 Divine Beasts, Master Sword, runes
  #   Medium: 2 Divine Beasts, Master Sword, runes (the values below)
  #   Hard:   nothing, Ganon whenever you like
  sanctum_divine_beasts: 2
  sanctum_shrines: 0
  sanctum_master_sword: true
  sanctum_runes: true
  # 0 to 2 Archipelago items at each of Beedle's 16 shops
  beedle_shop_items: 2
  # 0 to 28 Archipelago items on the 14 village stalls, at random (2 at most on one stall)
  stall_items: 10
  # When you die, everyone with DeathLink dies; when they die, so do you
  # (Mipha's Grace and fairies still save Link)
  death_link: true
  # How the weapons of the filler are spread over the game: smoothed (the weaker first, the amiibo's
  # treasures last), loosely_smoothed (the same, a weapon may come a level earlier or later) or anywhere
  weapon_order: smoothed
  # The regions' maps: region_keys (items, and a region's locations are in the logic once its map is received),
  # items (items only) or vanilla (each tower reveals its map, as in the game)
  tower_maps: region_keys
  # A map placed at one of the Great Plateau's first locations (its terminals or its tower):
  # gentle (Dueling Peaks, Hateno, Lake or Faron), any, or none
  early_map: gentle
  # With tower_maps on region_keys: a tower is in the logic once its region's map is received, like the rest of
  # its region (region_lock always asks for it)
  towers_need_maps: false
  # With tower_maps on region_keys: a region enters the logic once its map is received and it borders a region
  # already in the logic (with map_travel_points, bordering one or not); the game keeps Link out of the others
  region_lock: false
  # With the maps as items: a map received also opens the travel point of a shrine near where its region begins,
  # once Link has the Paraglider
  map_travel_points: false
  # The Master Cycle Zero (Champions' Ballad DLC) in the Gerudo Desert and on Death Mountain, and through the
  # invisible walls that stop horses; indoors still refuse it
  bike_anywhere: false
  # off, fast or removed. fast: + alone skips a cutscene, without X first and from a first game on, its prompt shown
  # at once; the black-screen intro before Link wakes is gone, and the Shrine of Resurrection and the plateau's first
  # view can be skipped too; a page of text shows at once, without its pauses. removed (experimental): what fast
  # skips is skipped at once, its effects kept. The mode can be changed after the build, in Cemu (the Archipelago
  # pack's Cutscenes preset)
  cutscene_skip: off
  # off, check_only or ap_items: whether the chests of Hyrule's surface (1,180), of its shrines (174) and of the
  # Divine Beasts (35, sent once a beast is freed if left inside) are locations. check_only: opening a chest sends
  # its item and the chest keeps its own contents. ap_items: each chest of the surface and of the Divine Beasts holds
  # the item it sends, under its name (a shrine's keeps its own, see shrine_chest_items). Unless chest_progression, the chests hold nothing
  # needed to finish a game. Traps stay as many as without the chests
  chest_sanity: off
  # With chest_sanity, chests may hold items needed to finish a game: the logic asks what the map says opening each one
  # takes (runes, bombs, Death Mountain's heat, a Divine Beast freed, the Gerudo Set in Gerudo Town; every rune inside
  # a shrine or a Divine Beast). Frozen chests, those under a boulder, after a Lynel or from a side quest still hold
  # nothing needed; a buried chest holds nothing needed in the first half of the game
  chest_progression: false
  # With chest_sanity on ap_items, whether a shrine's chest holds the item it sends too. WARNING: about 1 GB more
  # disk space, as a shrine's chest only changes with its whole shrine. The shrines are built once (a few seconds)
  # from your own base game, which must be installed as a folder (not a .wua or .wud file), then shared by every
  # seed. Without such a folder, the shrines' chests keep their contents
  shrine_chest_items: false
  # Whether the Koroks are locations: finding one sends its item, and the Korok still gives its seed (Hestu is
  # unchanged). The Koroks hold nothing needed to finish a game. Traps stay as many as without them
  korok_sanity: false
  # With korok_sanity, how many of the 900 Koroks are locations, drawn by the seed (900: every one). Each adds an
  # item to the multiworld, mostly filler
  korok_count: 100
  # Share of the filler (arrows, elixirs, weapons, gems, rupees) that becomes traps, 0 to 100, and how likely each is
  # compared with the others (a trap left out never comes up): Weapon Shatter, Blood Moon,
  # Rupoor, Hearts Down, Strip Down, Cucco Swarm, Yiga Ambush, Paranoia, Downpour. The cuccos, the Yiga
  # and the storm's lightning can kill Link.
  trap_percentage: 0
  trap_weights:
    Weapon Shatter: 1
    Blood Moon: 1
    Rupoor: 1
    Hearts Down: 1
    Strip Down: 1
    Cucco Swarm: 1
    Yiga Ambush: 1
    Paranoia: 1
    Downpour: 1
  start_inventory_from_pool: {}
